<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="店舗管理">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>店舗管理デモ</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee5;--accent:#2563eb;--good:#15803d;--danger:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select{font:inherit}button{touch-action:manipulation}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.side{background:#111827;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:10px}
.brand{font-size:22px;font-weight:800;padding:8px 10px 18px}.nav{display:flex;flex-direction:column;gap:8px}
.nav button{border:0;background:transparent;color:#d1d5db;text-align:left;padding:14px;border-radius:12px;font-weight:700}
.nav button.active{background:#2563eb;color:#fff}.foot{margin-top:auto;color:#9ca3af;font-size:12px;padding:10px}
.main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.title{font-size:28px;font-weight:800}.sub{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card{padding:16px}.card .k{font-size:12px;color:var(--muted);margin-bottom:6px}.card .v{font-size:24px;font-weight:800}
.panel{padding:18px;margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:#e5e7eb;color:#111827}
.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fee2e2;color:var(--danger)}.btn.good{background:#dcfce7;color:var(--good)}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.posbtn{border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:18px 10px;font-size:16px;font-weight:800;min-height:70px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:11px 10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}th{background:#f8fafc;font-size:12px;color:#475569;position:sticky;top:0}.num{text-align:right}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.dialog{width:min(520px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.dialog h3{margin:0 0 12px}
.notice{padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:92px;padding:8px}.day .d{font-weight:800;font-size:13px}.day .e{font-size:11px;margin-top:6px;color:#334155}
.status{font-size:12px;padding:7px 10px;border-radius:999px;background:#ecfdf5;color:#166534;font-weight:700}
.receipt{width:80mm;max-width:100%;margin:auto;background:#fff;color:#111;padding:8mm 6mm;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}
.receipt h3{text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:0 0 4px;font-size:18px}
.receipt .center{text-align:center}.receipt .rule{border-top:1px dashed #111;margin:8px 0}.receipt .row{display:flex;justify-content:space-between;gap:12px}.receipt .total{font-size:16px;font-weight:800}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;padding:8px;display:block}.brand{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:10px 12px}.foot{display:none}.main{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}.posgrid{grid-template-columns:repeat(2,1fr)}.title{font-size:23px}}
@media print{.side,.top .actions,.btn,.posgrid,.formgrid{display:none!important}.app{display:block}.main{padding:0}.panel,.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">店舗管理デモ</div>
<div class="nav">
<button class="active" data-page="home">ホーム</button>
<button data-page="sales">売上・POS</button>
<button data-page="expenses">経費</button>
<button data-page="inventory">在庫</button>
<button data-page="calendar">カレンダー</button>
<button data-page="monthly">月次・印刷</button>
</div>
<div class="foot">データ保存：このiPad内</div>
</aside>
<main class="main">
<div class="top">
<div><div id="pageTitle" class="title">ホーム</div><div class="sub">デモデータはこの端末内だけに保存されます</div></div>
<div class="actions"><span id="offlineStatus" class="status">オフライン対応</span><button class="btn" onclick="exportData()">バックアップ</button><button class="btn danger" onclick="resetDemo()">デモ初期化</button></div>
</div>

<section id="home" class="page">
<div class="cards">
<div class="card"><div class="k">本日の売上</div><div class="v" id="todaySales">¥0</div></div>
<div class="card"><div class="k">今月の売上</div><div class="v" id="monthSales">¥0</div></div>
<div class="card"><div class="k">今月の経費</div><div class="v" id="monthExp">¥0</div></div>
<div class="card"><div class="k">在庫金額</div><div class="v" id="invValue">¥0</div></div>
</div>
<div class="grid2"><div class="panel"><h2>最近の売上</h2><div id="recentSales"></div></div><div class="panel"><h2>本日の予定</h2><div id="todayEvents"></div></div></div>
</section>

<section id="sales" class="page hidden">
<div class="grid2">
<div class="panel"><h2>POS入力</h2>
<div class="actions" style="margin-top:0;margin-bottom:14px">
  <button id="catService" class="btn primary" onclick="setPosCategory('service')">施術</button>
  <button id="catRetail" class="btn" onclick="setPosCategory('retail')">店販</button>
</div>
<div class="posgrid" id="posGrid"></div>
<div class="actions"><button class="btn" onclick="openOther()">その他</button></div>
</div>
<div class="panel">
<h2>会計カート</h2>
<div id="cartList"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:20px;font-weight:800">
  <span>合計</span><span id="cartTotal">¥0</span>
</div>
<div class="formgrid" style="margin-top:14px">
<div><label>日付</label><input id="sDate" type="date"></div>
<div><label>支払方法</label><select id="sPayment" onchange="paymentChanged()"><option>現金</option><option>クレジットカード</option><option>電子マネー</option><option>QR決済</option><option>その他</option></select></div>
<div><label>預り金</label><input id="sReceived" type="number" inputmode="numeric" oninput="updateChange()" placeholder="現金時のみ"></div>
<div><label>店販売上</label><input id="sRetail" type="number" value="0" readonly></div>
<div class="full"><div class="notice" id="changeBox">お釣り：¥0</div></div>
</div>
<div class="actions">
  <button class="btn danger" onclick="clearCart()">カートを空にする</button>
  <button class="btn primary" onclick="checkout()">会計確定・レシート</button>
</div>
</div>
</div>
<div class="panel"><h2>売上一覧</h2><div id="salesTable"></div></div>
</section>

<section id="expenses" class="page hidden">
<div class="panel"><h2>経費入力</h2><div class="formgrid">
<div><label>日付</label><input id="eDate" type="date"></div><div><label>分類</label><select id="eCat"><option>消耗品</option><option>給与</option><option>雑誌</option><option>水光熱</option><option>仕入</option><option>交際費</option><option>車</option><option>家賃</option><option>その他</option></select></div>
<div class="full"><label>内容</label><input id="eMemo" placeholder="例：シャンプー仕入"></div><div><label>金額</label><input id="eAmount" type="number" inputmode="numeric"></div>
</div><div class="actions"><button class="btn primary" onclick="addExpense()">経費を登録</button></div></div>
<div class="panel"><h2>経費一覧</h2><div id="expenseTable"></div></div>
</section>

<section id="inventory" class="page hidden">
<div class="panel"><h2>在庫登録</h2><div class="formgrid"><div><label>品名</label><input id="iName"></div><div><label>単価</label><input id="iPrice" type="number"></div><div><label>数量</label><input id="iQty" type="number" value="1"></div></div><div class="actions"><button class="btn primary" onclick="addInventory()">商品を追加</button></div></div>
<div class="panel"><h2>在庫一覧</h2><div id="inventoryTable"></div></div>
</section>

<section id="calendar" class="page hidden">
<div class="panel"><h2>予定登録</h2><div class="formgrid"><div><label>日付</label><input id="cDate" type="date"></div><div><label>予定</label><input id="cTitle" placeholder="例：定休日"></div></div><div class="actions"><button class="btn primary" onclick="addEvent()">予定を登録</button></div></div>
<div class="panel"><h2 id="calTitle"></h2><div id="calendarGrid" class="calgrid"></div></div>
</section>

<section id="monthly" class="page hidden">
<div class="cards"><div class="card"><div class="k">月間売上</div><div class="v" id="mSales">¥0</div></div><div class="card"><div class="k">月間経費</div><div class="v" id="mExpense">¥0</div></div><div class="card"><div class="k">差引</div><div class="v" id="mProfit">¥0</div></div><div class="card"><div class="k">店販売上</div><div class="v" id="mRetail">¥0</div></div></div>
<div class="panel"><h2>月次集計</h2><div id="monthlyDetail"></div><div class="actions"><button class="btn primary" onclick="window.print()">印刷</button></div></div>
</section>
</main></div>

<div id="receiptModal" class="modal hidden"><div class="dialog" style="width:min(620px,100%)"><h3>レシートプレビュー</h3><div id="receiptPreview"></div><div class="actions"><button class="btn" onclick="closeReceipt()">閉じる</button><button class="btn primary" onclick="printReceipt()">印刷</button><button class="btn good" onclick="returnToSales()">売上・POSへ戻る</button></div></div></div>

<div id="otherModal" class="modal hidden"><div class="dialog"><h3>その他売上</h3><div class="notice">入力した内容を今回だけ使用するか、POSメニューへ登録できます。</div><label>内容</label><input id="otherName" placeholder="例：ヘッドスパ"><label style="margin-top:10px">金額</label><input id="otherPrice" type="number" inputmode="numeric"><div class="actions"><button class="btn" onclick="closeOther()">キャンセル</button><button class="btn" onclick="useOther(false)">今回だけ使用</button><button class="btn primary" onclick="useOther(true)">POSへ登録して使用</button></div></div></div>

<script>
const KEY='store_demo_pwa_v1';
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=()=>today().slice(0,7);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function seed(){return{
pos:[
{name:'カット',price:4500,category:'service'},
{name:'カラー',price:7000,category:'service'},
{name:'パーマ',price:8000,category:'service'},
{name:'シャンプー',price:1800,category:'service'},
{name:'トリートメント',price:3000,category:'service'},
{name:'店販商品',price:2500,category:'retail'}
],
sales:[{date:today(),item:'カット',total:4500,retail:0},{date:today(),item:'カラー',total:7000,retail:0},{date:today(),item:'店販商品',total:2500,retail:2500}],
expenses:[{date:today(),cat:'仕入',memo:'デモ仕入',amount:3200}],
inventory:[{name:'シャンプーA',price:2200,qty:6},{name:'トリートメントB',price:2800,qty:4},{name:'スタイリング剤C',price:1800,qty:5}],
events:[{date:today(),title:'デモ営業日'}]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}
db.pos=db.pos.map(p=>({...p,category:p.category||(p.name.includes('店販')?'retail':'service')}));
let currentPosCategory='service';
let cart=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function setDefaults(){['sDate','eDate','cDate'].forEach(id=>document.getElementById(id).value=today())}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.page).classList.remove('hidden');const titles={home:'ホーム',sales:'売上・POS',expenses:'経費',inventory:'在庫',calendar:'カレンダー',monthly:'月次・印刷'};document.getElementById('pageTitle').textContent=titles[b.dataset.page];renderAll()});
function renderAll(){renderPos();renderCart();renderSales();renderExpenses();renderInventory();renderHome();renderCalendar();renderMonthly()}
function setPosCategory(cat){
  currentPosCategory=cat;
  catService.className='btn'+(cat==='service'?' primary':'');
  catRetail.className='btn'+(cat==='retail'?' primary':'');
  renderPos();
}
function renderPos(){
  const items=db.pos.map((p,i)=>({...p,_i:i})).filter(p=>p.category===currentPosCategory);
  posGrid.innerHTML=items.length?items.map(p=>'<button class="posbtn" onclick="selectPos('+p._i+')">'+esc(p.name)+'<br><span class="sub">'+yen(p.price)+'</span></button>').join(''):'<div class="notice full">この区分の商品はまだ登録されていません。</div>';
}
function selectPos(i){
  const p=db.pos[i];
  const hit=cart.find(x=>x.name===p.name&&x.category===p.category&&x.price===p.price);
  if(hit) hit.qty+=1;
  else cart.push({name:p.name,price:Number(p.price),category:p.category,qty:1});
  renderCart();
}
function cartTotals(){
  const total=cart.reduce((a,x)=>a+x.price*x.qty,0);
  const retail=cart.filter(x=>x.category==='retail').reduce((a,x)=>a+x.price*x.qty,0);
  return {total,retail};
}
function renderCart(){
  const el=document.getElementById('cartList'); if(!el) return;
  if(!cart.length){
    el.innerHTML='<div class="notice">施術または店販商品を選択してください。</div>';
  }else{
    el.innerHTML='<div class="tablewrap"><table style="min-width:0"><thead><tr><th>内容</th><th>区分</th><th class="num">数量</th><th class="num">金額</th><th>操作</th></tr></thead><tbody>'+
    cart.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+(x.category==='retail'?'店販':'施術')+'</td><td class="num">'+x.qty+'</td><td class="num">'+yen(x.price*x.qty)+'</td><td><button class="btn" onclick="changeCartQty('+i+',-1)">−</button> <button class="btn" onclick="changeCartQty('+i+',1)">＋</button> <button class="btn danger" onclick="removeCartItem('+i+')">削除</button></td></tr>').join('')+
    '</tbody></table></div>';
  }
  const t=cartTotals();
  cartTotal.textContent=yen(t.total);
  sRetail.value=t.retail;
  if(sPayment.value!=='現金') sReceived.value=t.total||'';
  updateChange();
}
function changeCartQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function removeCartItem(i){cart.splice(i,1);renderCart()}
function clearCart(){cart=[];sReceived.value='';renderCart()}
function paymentChanged(){const t=cartTotals();if(sPayment.value!=='現金'){sReceived.value=t.total||''}updateChange()}
function updateChange(){const total=cartTotals().total,received=Number(sReceived.value||0);const change=sPayment.value==='現金'?Math.max(0,received-total):0;changeBox.textContent='お釣り：'+yen(change)}
function checkout(){
  const date=sDate.value,payment=sPayment.value,received=Number(sReceived.value||0),t=cartTotals();
  if(!date||!cart.length||!t.total){alert('会計する施術・商品を選択してください。');return}
  if(payment==='現金'&&received<t.total){alert('預り金が合計金額を下回っています。');return}
  const now=new Date();const slip='D'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
  const items=cart.map(x=>({...x}));
  const itemSummary=items.map(x=>x.name+(x.qty>1?'×'+x.qty:'')).join(' / ');
  const sale={date,item:itemSummary,total:t.total,retail:t.retail,payment,received:payment==='現金'?received:t.total,change:payment==='現金'?received-t.total:0,slip,time:pad(now.getHours())+':'+pad(now.getMinutes()),items};
  db.sales.unshift(sale);save();showReceipt(sale);cart=[];sReceived.value='';sPayment.value='現金';renderCart();
}
function showReceipt(r){const tax=Math.round(r.total*10/110),subtotal=r.total-tax;const lines=(r.items&&r.items.length?r.items:[{name:r.item,qty:1,price:r.total}]).map(x=>'<div class="row"><span>'+esc(x.name)+(x.qty>1?' ×'+x.qty:'')+'</span><span>'+yen(x.price*x.qty)+'</span></div>').join('');receiptPreview.innerHTML='<div class="receipt"><h3>店舗管理デモ</h3><div class="center">RECEIPT</div><div class="rule"></div><div>'+esc(r.date)+' '+esc(r.time||'')+'</div><div>伝票番号 '+esc(r.slip||'-')+'</div><div class="rule"></div>'+lines+'<div class="rule"></div><div class="row"><span>税抜</span><span>'+yen(subtotal)+'</span></div><div class="row"><span>消費税(10%)</span><span>'+yen(tax)+'</span></div><div class="row total"><span>合計</span><span>'+yen(r.total)+'</span></div><div class="rule"></div><div class="row"><span>支払方法</span><span>'+esc(r.payment||'現金')+'</span></div><div class="row"><span>お預り</span><span>'+yen(r.received??r.total)+'</span></div><div class="row"><span>お釣り</span><span>'+yen(r.change||0)+'</span></div><div class="rule"></div><div class="center">ありがとうございました</div></div>';receiptModal.classList.remove('hidden')}
function closeReceipt(){receiptModal.classList.add('hidden')}
function returnToSales(){
  closeReceipt();
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  const btn=document.querySelector('.nav button[data-page="sales"]');
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  document.getElementById('sales').classList.remove('hidden');
  document.getElementById('pageTitle').textContent='売上・POS';
  setPosCategory('service');
  window.scrollTo({top:0,behavior:'smooth'});
}
function printReceipt(){const html=receiptPreview.innerHTML;const w=window.open('','_blank','width=420,height=720');if(!w){alert('印刷画面を開けませんでした。');return}w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>レシート</title><style>@page{size:80mm auto;margin:0}body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.receipt{width:68mm;padding:6mm;font-size:12px;line-height:1.5}.receipt h3{text-align:center;font-family:sans-serif;margin:0 0 4px}.center{text-align:center}.rule{border-top:1px dashed #111;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px}.total{font-size:16px;font-weight:800}.demoBack{display:block;margin:18px auto;padding:12px 18px;border:0;border-radius:10px;background:#e5e7eb;font-weight:700}@media print{.demoBack{display:none}}</style></head><body>'+html+'<button class="demoBack" onclick="window.close()">売上・POSへ戻る</button></body></html>');w.document.close();setTimeout(()=>w.print(),250)}
function renderSales(){salesTable.innerHTML=makeTable(db.sales,['日付','摘要','総売','店販','支払'],r=>[r.date,esc(r.item),yen(r.total),yen(r.retail),esc(r.payment||'-')])}
function addExpense(){const x={date:eDate.value,cat:eCat.value,memo:eMemo.value.trim(),amount:Number(eAmount.value)};if(!x.date||!x.memo||!x.amount){alert('日付・内容・金額を入力してください。');return}db.expenses.unshift(x);save();eMemo.value='';eAmount.value=''}
function renderExpenses(){expenseTable.innerHTML=makeTable(db.expenses,['日付','分類','内容','金額'],r=>[r.date,'<span class="badge">'+esc(r.cat)+'</span>',esc(r.memo),yen(r.amount)])}
function addInventory(){const x={name:iName.value.trim(),price:Number(iPrice.value),qty:Number(iQty.value)};if(!x.name||!x.price){alert('品名・単価を入力してください。');return}db.inventory.push(x);save();iName.value='';iPrice.value='';iQty.value=1}
function changeQty(i,d){db.inventory[i].qty=Math.max(0,Number(db.inventory[i].qty)+d);save()}
function renderInventory(){inventoryTable.innerHTML='<div class="tablewrap"><table><thead><tr><th>品名</th><th class="num">単価</th><th class="num">数量</th><th class="num">合計</th><th>操作</th></tr></thead><tbody>'+db.inventory.map((r,i)=>'<tr><td>'+esc(r.name)+'</td><td class="num">'+yen(r.price)+'</td><td class="num">'+r.qty+'</td><td class="num">'+yen(r.price*r.qty)+'</td><td><button class="btn" onclick="changeQty('+i+',-1)">−</button> <button class="btn" onclick="changeQty('+i+',1)">＋</button></td></tr>').join('')+'</tbody></table></div>'}
function addEvent(){const x={date:cDate.value,title:cTitle.value.trim()};if(!x.date||!x.title){alert('日付・予定を入力してください。');return}db.events.push(x);save();cTitle.value=''}
function renderHome(){const ts=db.sales.filter(x=>x.date===today()).reduce((a,b)=>a+b.total,0),ms=db.sales.filter(x=>x.date.startsWith(ym())).reduce((a,b)=>a+b.total,0),me=db.expenses.filter(x=>x.date.startsWith(ym())).reduce((a,b)=>a+b.amount,0),iv=db.inventory.reduce((a,b)=>a+b.price*b.qty,0);todaySales.textContent=yen(ts);monthSales.textContent=yen(ms);monthExp.textContent=yen(me);invValue.textContent=yen(iv);recentSales.innerHTML=db.sales.length?db.sales.slice(0,6).map(x=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee"><span>'+esc(x.item)+' <span class="sub">'+x.date+'</span></span><b>'+yen(x.total)+'</b></div>').join(''):'売上はありません';const ev=db.events.filter(x=>x.date===today());todayEvents.innerHTML=ev.length?ev.map(x=>'<div class="badge" style="margin:4px">'+esc(x.title)+'</div>').join(''):'予定はありません'}
function renderCalendar(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);calTitle.textContent=y+'年'+(m+1)+'月';let a=[];for(let i=0;i<first.getDay();i++)a.push('<div></div>');for(let day=1;day<=last.getDate();day++){const ds=y+'-'+pad(m+1)+'-'+pad(day),ev=db.events.filter(x=>x.date===ds);a.push('<div class="day"><div class="d">'+day+'</div>'+ev.map(x=>'<div class="e">'+esc(x.title)+'</div>').join('')+'</div>')}calendarGrid.innerHTML=a.join('')}
function renderMonthly(){const s=db.sales.filter(x=>x.date.startsWith(ym())),e=db.expenses.filter(x=>x.date.startsWith(ym())),st=s.reduce((a,b)=>a+b.total,0),rt=s.reduce((a,b)=>a+b.retail,0),et=e.reduce((a,b)=>a+b.amount,0);mSales.textContent=yen(st);mExpense.textContent=yen(et);mProfit.textContent=yen(st-et);mRetail.textContent=yen(rt);const by={};e.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);monthlyDetail.innerHTML='<p><b>'+ym()+'</b> の集計</p><div class="tablewrap"><table><thead><tr><th>経費分類</th><th class="num">金額</th></tr></thead><tbody>'+Object.entries(by).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="num">'+yen(v)+'</td></tr>').join('')+'</tbody></table></div>'}
function makeTable(rows,heads,map){return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+map(r).map((v,i)=>'<td class="'+(i>=2?'num':'')+'">'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function openOther(){otherModal.classList.remove('hidden');otherName.focus()}function closeOther(){otherModal.classList.add('hidden');otherName.value='';otherPrice.value=''}
function useOther(register){const n=otherName.value.trim(),p=Number(otherPrice.value);if(!n||!p){alert('内容と金額を入力してください。');return}if(register&&!db.pos.some(x=>x.name===n))db.pos.push({name:n,price:p,category:currentPosCategory});const hit=cart.find(x=>x.name===n&&x.category===currentPosCategory&&x.price===p);if(hit)hit.qty+=1;else cart.push({name:n,price:p,category:currentPosCategory,qty:1});save();renderCart();closeOther()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='店舗管理デモ_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetDemo(){if(confirm('デモデータを初期状態に戻しますか？')){db=seed();save();setDefaults()}}
function updateOnline(){offlineStatus.textContent=navigator.onLine?'オフライン対応':'オフライン稼働中'}window.addEventListener('online',updateOnline);window.addEventListener('offline',updateOnline);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
setDefaults();updateOnline();setPosCategory('service');renderAll();
</script>
